# =============================================================================
# TANTGen attack registry
# =============================================================================
# One block per attack. Used by `scripts/run_attack.py`.
#
# Keys:
#   pipeline        kitsune_native | cicids_ml | cicids_kitsune | hypervision
#   pcap            absolute or repo-relative path to the source .pcap/.pcapng
#   labels          path to the labels file (format depends on pipeline)
#   ratios          per-pipeline split ratios (see below)
#   margin          finetune evasion margin (-4 for CIC-IDS, 0 for Kitsune-style)
#   pretrain        informational; the pipeline type already decides this
#   family          used by batch flags (--all-kitsune / --all-cicids /
#                   --all-cicddos / --all-hypervision)
#
# Ratios per pipeline:
#   kitsune_native / cicids_kitsune / hypervision
#       train_nids, train_surrogate_b, train_adversarial, train_surrogate_m
#   cicids_ml
#       nids, surrogate, adversarial, test
# =============================================================================


# =============================================================================
# EXISTING ATTACKS (mirror of scripts/run_*.py — kept for batch coverage)
# =============================================================================

Mirai:
  pipeline: kitsune_native
  pcap: data/original/Kitsune/Mirai Botnet/Mirai.pcap
  labels: data/original/Kitsune/Mirai Botnet/mirai_labels.csv
