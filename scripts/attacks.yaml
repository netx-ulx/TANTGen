# =============================================================================
# HYPERVISION (16 attacks, Kitsune NIDS target)
# =============================================================================
# Download:
#   wget https://www.hypervision.fuchuanpu.xyz/hypervision-dataset.tar.gz
#   tar -xzf hypervision-dataset.tar.gz -C data/original/HyperVision/
#
# HyperVision distributes per-attack pcaps with per-packet labels in a custom
# format. The `hypervision` pipeline first runs
# `HyperVision_divide_BM.py` to convert those labels to the binary `x` CSV
# expected by the Kitsune splitter, then proceeds through the Kitsune→Kitsune
# pipeline.
#
# NOTE: After downloading, verify the actual filenames under
#       data/original/HyperVision/ and adjust the `pcap`/`labels` paths below
#       if upstream uses different naming. The keys here follow the labels
#       documented in HyperVision Table VI of the NDSS'23 paper.

