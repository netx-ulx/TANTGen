# =============================================================================
# HYPERVISION — INTENTIONALLY EMPTY
# =============================================================================
# The publicly-distributed HyperVision archive ships *post-processed* flow
# records (.data + .label, custom ASCII format), not raw pcaps. TANTGen's
# adversarial generator operates on packet bytes, so the published format is
# not consumable here. To restore HyperVision attacks, you'd need raw pcaps
# (e.g. by re-running HyperVision's `dataset_construct/` C++ tooling on the
# upstream MAWI + per-attack source captures) and then re-add registry blocks
# pointing at the resulting .pcap + .label pairs. The `hypervision` pipeline
# wrapper in scripts/utils.py and `HyperVision_divide_BM.py` are kept in place
# so a future re-add only requires editing this file.
