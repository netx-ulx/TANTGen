#---------------------------
# Pretrain model parameters
#---------------------------
loss_fun_diff: huber
loss_fun_evasion: bce
# loss_fun_constraints: mse

lambda_evasion: 2.0
lambda_constraints: 1.0

time_rate_limit: 2 # 15 para 5 # 20 dá na verdade 7.25x, e um ASR de 0.56; 22 dá na verdade 8.5x, e um ASR de 0.9996
size_rate_limit: 1

epochs: 100
batch_size: 64

#--------------------
# Dataset parameters
#--------------------
dataset_path: data/preprocessed/adversarial_train/Mirai_malicious_features.csv