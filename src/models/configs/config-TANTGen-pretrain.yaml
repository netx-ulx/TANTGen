#---------------------------
# Pretrain model parameters
#---------------------------
name: transformer pretrain

weight_decay: 1e-5
learning_rate: 1e-4            
dropout: 0.2                   
num_heads: 8                      
num_layers: 6                      
linear_size: 120 
loss_function: huber
epochs: 15
batch_size: 64

# --------------------------
# Sliding window parameters
# --------------------------
sliding_window_size: 64
window_stride: 64

#--------------------
# Dataset parameters
#--------------------
dataset_path: data/preprocessed/adversarial_train/benign_1M.csv
num_features: 7
output_size: 1

#--------------------
# Save parameters
#--------------------
save_path: src/models/transformer_iat_logs
model_name: TANTGen_pretrain_window